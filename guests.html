<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ответы гостей</title><style>*{box-sizing:border-box}body{font:16px/1.6 Arial;background:#f1ebe5;color:#765667;margin:0;padding:24px}main{max-width:800px;margin:auto}input,button{font:inherit;padding:12px;border:1px solid #c8b593;border-radius:6px;max-width:100%}button{background:#875b74;color:white;cursor:pointer}article{background:#fffdf8;padding:16px;margin:10px 0;overflow-wrap:anywhere}h1{font:32px Georgia}#list{margin-top:20px}</style><main><h1>Ответы гостей</h1><form id="login"><label for="password">Пароль организатора</label><p><input id="password" type="password" autocomplete="current-password" required> <button>Открыть список</button></p></form><p id="status" role="status"></p><div id="list"></div></main><script>
const form=document.querySelector('form'),status=document.querySelector('#status'),list=document.querySelector('#list');form.onsubmit=async e=>{e.preventDefault();status.textContent='Загрузка…';list.replaceChildren();try{const r=await fetch('/api/rsvp',{headers:{Authorization:'Bearer '+document.querySelector('input').value}}),data=await r.json();if(!r.ok)throw Error(data.error);const yes=data.guests.filter(g=>g.attendance==='yes').length;status.textContent=`Будут присутствовать: ${yes}. Не смогут: ${data.guests.length-yes}. Всего ответов: ${data.guests.length}.`;for(const g of data.guests){const row=document.createElement('article'),name=document.createElement('strong'),text=document.createElement('div');name.textContent=g.name;text.textContent=(g.attendance==='yes'?'Будет присутствовать':'Не сможет присутствовать')+' · '+new Date(g.createdAt).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'});row.append(name,text);list.append(row)}}catch(err){status.textContent=err.message||'Ошибка загрузки'}};
</script></html>
