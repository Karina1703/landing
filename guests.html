<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Гости · Юбилей Раиля Ильдаровича</title><style>
:root{--paper:#fffaf1;--plum:#805b70;--gold:#b69b70}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--plum);font:16px/1.6 Arial,sans-serif;-webkit-text-size-adjust:100%}main{max-width:1000px;margin:38px auto;padding:38px 42px;border:1px solid #b69b7070;border-radius:22px}header{text-align:center}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase}h1{font:400 43px/1.2 Georgia,serif;margin:16px 0 8px}.subtitle{font-size:14px;margin:0}a{color:inherit}.orn{color:var(--gold);font:30px Georgia;margin:20px auto} .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:30px 0}.stat{border:1px solid #b69b7055;border-radius:14px;padding:20px;text-align:center}.stat strong{display:block;font:36px Georgia;margin-bottom:5px}.stat span{font-size:13px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select,button{font:16px Arial;color:var(--plum);background:var(--paper);border:1px solid #b69b7080;border-radius:9px;min-height:46px;padding:11px 14px}input{flex:1;min-width:160px}button{cursor:pointer}button:hover{border-color:var(--plum)}:focus-visible{outline:2px solid var(--plum);outline-offset:3px}#list{display:grid;gap:12px}.guest{display:flex;gap:16px;align-items:center;border:1px solid #b69b7055;border-radius:13px;padding:18px 20px}.avatar{width:44px;height:44px;border:1px solid #b69b7066;border-radius:50%;display:grid;place-items:center;font:22px Georgia;flex-shrink:0}.info{flex:1;min-width:0}.name{font-size:17px;font-weight:500;overflow-wrap:anywhere}.meta{font-size:12px;margin-top:5px;opacity:.85}.badge{font-size:12px;border:1px solid #b69b7070;border-radius:30px;padding:5px 10px;white-space:nowrap}.remove{font-size:13px;border-color:transparent;text-decoration:underline;text-underline-offset:4px;padding:8px;min-height:44px}.empty{text-align:center;border:1px dashed #b69b7080;border-radius:14px;padding:45px 20px}#status{font-size:14px;min-height:22px}.footer{text-align:center;margin-top:30px;font-size:12px}dialog{background:var(--paper);color:var(--plum);border:1px solid var(--gold);border-radius:16px;padding:28px;width:calc(100% - 36px);max-width:420px}dialog::backdrop{background:#805b7040}dialog h2{font:28px Georgia;margin:0 0 12px}dialog p{overflow-wrap:anywhere}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.primary{background:var(--plum);color:var(--paper);border-color:var(--plum)}@media(max-width:650px){main{margin:12px;padding:26px 16px;border-radius:17px}h1{font-size:34px}.stats{gap:7px}.stat{padding:15px 5px}.stat strong{font-size:30px}.stat span{font-size:11px}.guest{padding:15px 12px;gap:10px;flex-wrap:wrap}.info{flex-basis:calc(100% - 60px)}.badge{margin-left:54px}.remove{margin-left:auto}.toolbar{gap:8px}select{flex:1;min-width:0}input{width:100%;flex-basis:100%}.subtitle{font-size:13px}}

html,body{max-width:100%;overflow-x:hidden;scrollbar-width:none}body::-webkit-scrollbar{display:none}
main{width:calc(100% - 32px);max-width:940px;margin:28px auto;padding:32px;border-color:#b69b7060}
h1{font-size:39px;margin-top:14px}.orn{margin:16px auto;font-size:25px}
.stats{gap:12px;margin:24px 0}.stat{padding:18px 10px;min-width:0;border-radius:12px}.stat strong{font-size:34px}.stat span{font-size:13px}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,230px) auto;gap:10px;margin:22px 0 14px}
.toolbar input,.toolbar select,.toolbar button{width:100%;min-width:0;font-size:16px;border-color:#b69b7080;outline:none;transition:border-color .15s,box-shadow .15s}
.toolbar input:focus,.toolbar select:focus,.toolbar button:focus-visible{border-color:var(--plum);box-shadow:0 0 0 3px #805b7010}
.guest{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px}.badge{white-space:normal;text-align:center;max-width:170px}.remove{margin:0}.name{line-height:1.5}.meta{line-height:1.6}.empty{padding:34px 20px;border-radius:12px;font-size:15px}#status{font-size:13px;margin:12px 0 16px}.footer{margin-top:26px}
@media(max-width:650px){main{width:calc(100% - 24px);margin:12px auto;padding:26px 16px;border-radius:16px}h1{font-size:33px}.subtitle{font-size:13px}.eyebrow{font-size:9px;letter-spacing:.12em}.stats{gap:7px;margin-top:22px}.stat{padding:15px 4px}.stat strong{font-size:30px;margin-bottom:7px}.stat span{font-size:12px}.toolbar{grid-template-columns:minmax(0,1fr) auto;gap:9px}.toolbar input{grid-column:1/-1}.toolbar select{padding-right:26px}.toolbar button{padding:11px 12px}.guest{grid-template-columns:36px minmax(0,1fr) auto;padding:14px 12px;gap:10px}.avatar{width:36px;height:36px;font-size:20px}.info{min-width:0}.badge{grid-column:2;grid-row:2;margin:0;justify-self:start;font-size:11px;max-width:100%}.remove{grid-column:3;grid-row:1/3;font-size:12px}.name{font-size:16px}.meta{font-size:11px}.empty{padding:30px 15px}.footer{font-size:13px}}
@media(max-width:350px){main{padding-left:12px;padding-right:12px}.toolbar{grid-template-columns:minmax(0,1fr)}.toolbar input{grid-column:auto}.stat span{font-size:11px}.guest{grid-template-columns:30px minmax(0,1fr)}.avatar{width:30px;height:30px}.remove{grid-column:2;grid-row:3;justify-self:start;padding-left:0}.badge{grid-column:2;grid-row:2}}
</style></head><body><main><header><div class="eyebrow">6 ноября 2026 · Казань</div><h1>Наши гости</h1><p class="subtitle">Юбилейный вечер Раиля Ильдаровича</p><div class="orn" aria-hidden="true">— ❧ —</div></header><section class="stats" aria-label="Статистика"><div class="stat"><strong id="total">—</strong><span>Всего ответов</span></div><div class="stat"><strong id="yes">—</strong><span>Придут</span></div><div class="stat"><strong id="no">—</strong><span>Не придут</span></div></section><div class="toolbar"><input id="search" type="search" placeholder="Найти гостя по имени" aria-label="Поиск гостей"><select id="filter" aria-label="Показать ответы"><option value="all">Все ответы</option><option value="yes">Будут присутствовать</option><option value="no">Не смогут прийти</option></select><button id="refresh">Обновить</button></div><p id="status" role="status"></p><section id="list" aria-label="Список гостей"></section><p class="footer"><a href="/">Открыть приглашение</a></p></main><dialog id="confirm"><h2>Удалить гостя?</h2><p id="delete-name"></p><p>Ответ будет удалён из списка.</p><p id="delete-error" role="status"></p><div class="actions"><button id="cancel">Отмена</button><button id="delete" class="primary">Удалить</button></div></dialog><script>
const $=id=>document.getElementById(id);let guests=[],pending=null;const dialog=$('confirm');
function render(){const term=$('search').value.trim().toLocaleLowerCase('ru'),filter=$('filter').value;$('total').textContent=guests.length;$('yes').textContent=guests.filter(g=>g.attendance==='yes').length;$('no').textContent=guests.filter(g=>g.attendance==='no').length;const shown=guests.filter(g=>(filter==='all'||g.attendance===filter)&&g.name.toLocaleLowerCase('ru').includes(term));$('list').replaceChildren();if(!shown.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=guests.length?'Гости по вашему запросу не найдены.':'Здесь появятся ответы ваших гостей.';$('list').append(empty)}for(const g of shown){const row=document.createElement('article');row.className='guest';const avatar=document.createElement('div');avatar.className='avatar';avatar.setAttribute('aria-hidden','true');avatar.textContent=g.name.trim().charAt(0).toUpperCase();const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=g.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=new Date(g.createdAt).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});info.append(name,meta);const badge=document.createElement('span');badge.className='badge';badge.textContent=g.attendance==='yes'?'Будет присутствовать':'Не сможет прийти';const remove=document.createElement('button');remove.className='remove';remove.textContent='Удалить';remove.setAttribute('aria-label','Удалить гостя '+g.name);remove.onclick=()=>{pending=g;$('delete-name').textContent=g.name;$('delete-error').textContent='';dialog.showModal()};row.append(avatar,info,badge,remove);$('list').append(row)}}
async function request(options){const r=await fetch('/api/rsvp',options);if(!(r.headers.get('content-type')||'').includes('application/json'))throw Error('Сервис временно недоступен. Попробуйте позже.');const data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось выполнить запрос.');return data}
async function load(){$('refresh').disabled=true;$('status').textContent='Обновляем список…';try{const data=await request();guests=data.guests;render();$('status').textContent='Список обновлён'}catch(e){$('status').textContent=e.message}finally{$('refresh').disabled=false}}
$('delete').onclick=async()=>{if(!pending)return;$('delete').disabled=true;$('cancel').disabled=true;try{await request({method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:pending.id})});guests=guests.filter(g=>g.id!==pending.id);render();dialog.close();$('status').textContent='Гость удалён';pending=null}catch(e){$('delete-error').textContent=e.message}finally{$('delete').disabled=false;$('cancel').disabled=false}};$('cancel').onclick=()=>dialog.close();$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;load();
</script></body></html>
